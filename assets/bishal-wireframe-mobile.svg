<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1500" viewBox="0 0 420 1500" font-family="Arial, Helvetica, sans-serif">
  <rect width="420" height="1500" fill="#ffffff"/>
  <text x="20" y="14" font-size="11" fill="#9a9490">Wireframe — Mobile home (375px).</text>

  <!-- phone frame -->
  <rect x="60" y="24" width="300" height="1456" rx="24" fill="#fbfbfa" stroke="#d8d4cf" stroke-width="2"/>

  <!-- NAV -->
  <rect x="60" y="24" width="300" height="52" rx="24" fill="#f1efea"/>
  <rect x="78" y="40" width="20" height="20" fill="#c9c3bb"/>
  <text x="106" y="54" font-size="11" font-weight="bold" fill="#7a746c">BISHAL IMAGERY</text>
  <g stroke="#7a746c" stroke-width="2">
    <line x1="322" y1="44" x2="340" y2="44"/>
    <line x1="322" y1="50" x2="340" y2="50"/>
    <line x1="322" y1="56" x2="340" y2="56"/>
  </g>
  <text x="300" y="70" font-size="8" fill="#9a9490">hamburger</text>

  <!-- HERO -->
  <rect x="60" y="76" width="300" height="360" fill="#e8e4de"/>
  <text x="80" y="250" font-size="22" font-weight="bold" fill="#6f6a62">Framing</text>
  <text x="80" y="278" font-size="22" font-weight="bold" fill="#6f6a62">Your Story</text>
  <text x="80" y="302" font-size="10" fill="#8a847c">Timeless, natural photography</text>
  <rect x="80" y="320" width="240" height="40" fill="#8B7355"/>
  <text x="120" y="345" font-size="10" fill="#ffffff">BOOK YOUR SESSION</text>
  <rect x="80" y="368" width="240" height="40" fill="none" stroke="#8a847c"/>
  <text x="135" y="393" font-size="10" fill="#8a847c">VIEW MY WORK</text>

  <!-- PORTFOLIO (single column) -->
  <text x="80" y="470" font-size="10" letter-spacing="2" fill="#8B7355">PORTFOLIO</text>
  <text x="80" y="492" font-size="16" font-weight="bold" fill="#6f6a62">A Glimpse of Our Work</text>
  <g fill="#e2ddd6" stroke="#d8d4cf">
    <rect x="80" y="506" width="240" height="150"/>
    <rect x="80" y="664" width="240" height="150"/>
  </g>
  <text x="95" y="586" font-size="9" fill="#9a9490">Wedding</text>
  <text x="95" y="744" font-size="9" fill="#9a9490">Family</text>

  <!-- SERVICES (stacked) -->
  <rect x="60" y="844" width="300" height="300" fill="#f5efe6"/>
  <text x="80" y="884" font-size="10" letter-spacing="2" fill="#8B7355">SERVICES</text>
  <g font-size="10" fill="#7a746c">
    <rect x="80" y="900" width="240" height="52" fill="#ffffff" stroke="#e4ddd2"/>
    <text x="96" y="930">◭ Wedding Photography</text>
    <rect x="80" y="960" width="240" height="52" fill="#ffffff" stroke="#e4ddd2"/>
    <text x="96" y="990">◭ Engagement Shoots</text>
    <rect x="80" y="1020" width="240" height="52" fill="#ffffff" stroke="#e4ddd2"/>
    <text x="96" y="1050">◭ Family Sessions</text>
    <rect x="80" y="1080" width="240" height="52" fill="#ffffff" stroke="#e4ddd2"/>
    <text x="96" y="1110">◭ Portrait · Event · Baby Shower</text>
  </g>

  <!-- ABOUT -->
  <rect x="80" y="1164" width="240" height="150" fill="#e2ddd6" stroke="#d8d4cf"/>
  <text x="100" y="1244" font-size="9" fill="#9a9490">[ photo carousel ]</text>
  <text x="80" y="1344" font-size="14" font-weight="bold" fill="#6f6a62">Meet the Photographer</text>
  <g fill="#cfc9c1">
    <rect x="80" y="1358" width="240" height="8"/>
    <rect x="80" y="1372" width="240" height="8"/>
    <rect x="80" y="1386" width="180" height="8"/>
  </g>

  <!-- CONTACT -->
  <rect x="60" y="1420" width="300" height="60" rx="0" fill="#1a1a1a"/>
  <text x="80" y="1448" font-size="9" fill="#e8e4de">CONTACT · booking form</text>
  <text x="80" y="1464" font-size="9" fill="#9a9490">Email* · Phone* required → inbox</text>
